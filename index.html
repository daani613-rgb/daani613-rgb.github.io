<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Engines</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --txt:#e8eaed; --mut:#9aa0aa;
    --live:#2ea043; --season:#3b82f6; --off:#6b7280; --accent:#2ea043;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;padding:24px 16px;max-width:880px;margin:0 auto;min-height:100vh}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  h1{font-size:1.6rem;margin:.1em 0}
  .sub{color:var(--mut);font-size:.9rem;max-width:560px}
  .toggle{cursor:pointer;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:6px;padding:6px 12px;font-size:.85rem;flex-shrink:0}
  .grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:22px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:840px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:18px;text-decoration:none;color:inherit;
    transition:border-color .15s, transform .15s;min-height:150px}
  .card:hover,.card:focus{border-color:var(--accent);transform:translateY(-2px);outline:none}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ctop{display:flex;align-items:center;gap:10px}
  .icon{font-size:1.6rem;line-height:1}
  .name{font-weight:700;font-size:1.1rem}
  .desc{color:var(--mut);font-size:.85rem;flex-grow:1}
  .pill{align-self:flex-start;font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:600;
    display:inline-flex;align-items:center;gap:5px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.live{background:#13251a;color:#4ade80;border:1px solid #1e3a28}
  .pill.season{background:#13203a;color:#7aa7f0;border:1px solid #1e2f4a}
  .pill.off{background:#1e2128;color:#848a96;border:1px solid var(--line)}
  footer{color:var(--mut);font-size:.78rem;margin-top:32px;border-top:1px solid var(--line);padding-top:14px}
  .arrow{margin-inline-start:auto;color:var(--mut);font-size:1.1rem}
  .rec{font-size:.82rem;color:var(--txt)}
  /* tap targets at least 44 x 44 px (KNOWN_DEFECTS 92) */
  button{min-height:44px;min-width:44px}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Prediction Engines</h1>
    <div class="sub" id="subtitle">Applying a disciplined trading method to sports outcomes: each engine speaks only on high-confidence setups, and stays silent otherwise.</div>
  </div>
  <button class="toggle" id="langToggle">עב</button>
</header>

<div class="grid" id="grid"></div>

<footer id="footer"></footer>

<script>
// ====== The engines. Status and live record are read from each engine's own published data
// (preview/<sport>/app.js, line 2 = window.REAL), never typed here. No data: no status claim, no number. ======
const ENGINES = [
  { id:"nba", sp:"nba", icon:"🏀", url:"https://daani613-rgb.github.io/nba-dashboard/",
    name:{en:"NBA", he:"NBA"},
    desc:{en:"Elo with a form stage; speaks on high-confidence calls only.", he:"Elo עם שלב צורה; מדבר רק על קריאות בביטחון גבוה."} },
  { id:"worldcup", sp:"worldcup", icon:"⚽", url:"https://daani613-rgb.github.io/worldcup-dashboard/",
    name:{en:"World Cup 2026", he:"מונדיאל 2026"},
    desc:{en:"International Elo with confidence discipline.", he:"Elo בינלאומי עם משמעת ביטחון."} },
  { id:"baseball", sp:"mlb", icon:"⚾", url:"https://daani613-rgb.github.io/baseball-dashboard/",
    name:{en:"MLB", he:"בייסבול MLB"},
    desc:{en:"Elo with a form stage and the day's starting pitchers.", he:"Elo עם שלב צורה והזורקים הפותחים של היום."} },
  { id:"tennis", sp:"tennis", icon:"🎾", url:"https://daani613-rgb.github.io/tennis-dashboard/",
    name:{en:"ATP Tennis", he:"טניס ATP"},
    desc:{en:"Surface-blended Elo with a form stage; CLV measured forward.", he:"Elo משוקלל משטח עם שלב צורה; CLV נמדד קדימה."} },
  { id:"nfl", sp:"nfl", icon:"🏈", url:"https://daani613-rgb.github.io/nfl-dashboard/",
    name:{en:"NFL", he:"NFL"},
    desc:{en:"Margin-aware Elo with a form stage.", he:"Elo מודע-מרווח עם שלב צורה."} },
];

const I18N = {
  en:{title:"Prediction Engines",
      subtitle:"Applying a disciplined trading method to sports outcomes: each engine speaks only on high-confidence setups, and stays silent otherwise.",
      footer:"Status and record on each card are read from the engine's own published data. Each engine's page says when it last updated.",
      loading:"Reading the engine's data…", na:"Status unavailable (the engine's data could not be read)"},
  he:{title:"מנועי חיזוי",
      subtitle:"יישום שיטת מסחר ממושמעת על תוצאות ספורט: כל מנוע מדבר רק על סטאפים בביטחון גבוה, ושותק אחרת.",
      footer:"הסטטוס והרשומה בכל כרטיס נקראים מהנתונים שהמנוע עצמו מפרסם. בדף של כל מנוע כתוב מתי עודכן לאחרונה.",
      loading:"קורא את נתוני המנוע…", na:"הסטטוס לא זמין (לא ניתן לקרוא את נתוני המנוע)"}
};

const dm = d => { const m = String(d||"").match(/^(\d{4})-?(\d{2})-?(\d{2})/); return m ? `${m[3]}.${m[2]}` : ""; };
const pct1 = (c, n) => (100 * c / n).toFixed(1);

// status: {cls, en, he}; rec: {en, he} or null. Every value comes from R.
const DERIVE = {
  nfl: R => ({
    status: R.state === "in_season" ? {cls:"live", en:`In season · week ${R.curWeek}`, he:`בעונה · שבוע ${R.curWeek}`}
                                      : {cls:"off", en:"Between seasons", he:"בין עונות"},
    rec: (R.seasonRecord && R.seasonRecord.n) ? {
      en:`Season ${R.season}: ${R.seasonRecord.correct} of ${R.seasonRecord.n} right (${R.seasonRecord.pct}%)` + (R.aplusSeason && R.aplusSeason.n ? ` · A+ ${R.aplusSeason.correct} of ${R.aplusSeason.n}` : ""),
      he:`עונת ${R.season}: ${R.seasonRecord.correct} מתוך ${R.seasonRecord.n} נכונות (${R.seasonRecord.pct}%)` + (R.aplusSeason && R.aplusSeason.n ? ` · A+ ${R.aplusSeason.correct} מתוך ${R.aplusSeason.n}` : "") } : null }),
  nba: R => ({
    status: R.isOffseason ? {cls:"off", en:"Off-season" + (R.nextGame && R.nextGame.date ? ` · next game ${dm(R.nextGame.date)}` : ""),
                                         he:"מחוץ לעונה" + (R.nextGame && R.nextGame.date ? ` · המשחק הבא ${dm(R.nextGame.date)}` : "")}
                          : {cls:"live", en:"In season", he:"בעונה"},
    rec: null }),   // no live record yet: the figures on its page are a walk-forward reconstruction, not live calls
  mlb: R => ({
    status: (R.slate && R.slate.games > 0) ? {cls:"live", en:`Games on ${dm(R.slate.date)}: ${R.slate.games}`, he:`משחקים ב-${dm(R.slate.date)}: ${R.slate.games}`}
                                           : {cls:"off", en:"No games on the slate", he:"אין משחקים בלוח"},
    rec: (R.liveRecord && R.liveRecord.calls) ? {
      en:`Live A+ record ${R.liveRecord.season}: ${R.liveRecord.correct} of ${R.liveRecord.calls} (${pct1(R.liveRecord.correct, R.liveRecord.calls)}%)`,
      he:`רשומת A+ חיה ${R.liveRecord.season}: ${R.liveRecord.correct} מתוך ${R.liveRecord.calls} (${pct1(R.liveRecord.correct, R.liveRecord.calls)}%)`} : null }),
  tennis: R => {
    const today = new Date().toISOString().slice(0, 10);
    const paused = R.quotaPauseUntil && today < R.quotaPauseUntil;
    const A = R.accuracy || {};
    const c = A.journal_n ? Math.round(A.journal_acc * A.journal_n / 100) : null;
    const ca = A.journal_aplus_n ? Math.round(A.journal_aplus_acc * A.journal_aplus_n / 100) : null;
    return {
      status: paused ? {cls:"off", en:`Paused until ${dm(R.quotaPauseUntil)} (odds quota)`, he:`מושהה עד ${dm(R.quotaPauseUntil)} (מכסת יחסים)`}
                     : {cls:"live", en:"Running", he:"פעיל"},
      rec: A.journal_n ? {
        en:`Journal: ${c} of ${A.journal_n} right (${A.journal_acc}%)` + (ca != null ? ` · A+ ${ca} of ${A.journal_aplus_n}` : ""),
        he:`יומן: ${c} מתוך ${A.journal_n} נכונות (${A.journal_acc}%)` + (ca != null ? ` · A+ ${ca} מתוך ${A.journal_aplus_n}` : "")} : null };
  },
  worldcup: R => {
    const ms = R.matches || [];   // from the payload; from status.json: all_decided and last_match_date
    const done = R.all_decided !== undefined ? R.all_decided : (ms.length > 0 && ms.every(m => m.decided));
    const last = R.last_match_date !== undefined ? R.last_match_date : ms.map(m => m.date).filter(Boolean).sort().pop();
    const A = R.accuracy || {};
    return {
      status: done ? {cls:"off", en:`Tournament ended · ${dm(last)}`, he:`הטורניר הסתיים · ${dm(last)}`}
                   : {cls:"live", en:"Tournament on", he:"הטורניר פעיל"},
      rec: A.n_called ? {en:`A+ calls: ${A.n_correct} of ${A.n_called} right (${A.aplus}%)`,
                         he:`קריאות A+: ${A.n_correct} מתוך ${A.n_called} נכונות (${A.aplus}%)`} : null };
  },
};

let lang = "en";
const DATA = {};   // sp -> {status, rec} | "na"

// status.json first (about 0.2 KB per engine; its "hub" holds the fields DERIVE reads, copied from the payload by the
// generator, STATUS_JSON_PREREGISTER.md in the preview repo); missing, not JSON or not of that shape: the payload, as before.
const okStatus = (j, sp) => !!j && j.v === 1 && j.engine === sp && typeof j.open_call === "boolean"
  && (j.last_data_date === null || /^\d{4}-\d{2}-\d{2}$/.test(String(j.last_data_date))) && !!j.hub && typeof j.hub === "object";
function fromPayload(e){
  return fetch(`./preview/${e.sp}/app.js`, {cache:"no-store"})
    .then(r => r.ok ? r.text() : Promise.reject(r.status))
    .then(txt => { const line = txt.split("\n")[1] || ""; const R = JSON.parse(line.slice(line.indexOf("=") + 1).trim().replace(/;$/, ""));
                   DATA[e.sp] = DERIVE[e.sp](R); })
    .catch(() => { DATA[e.sp] = "na"; });
}
function loadAll(){
  ENGINES.forEach(e => {
    fetch(`./preview/${e.sp}/status.json`, {cache:"no-store"})
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if (!okStatus(j, e.sp)) throw new Error("status.json shape"); DATA[e.sp] = DERIVE[e.sp](j.hub);
                   // C_HUB_STALE_PREREGISTER.md: status.json written more than 36 h ago -> "not updated"
                   const bt = j.built_utc ? Date.parse(j.built_utc) : NaN;
                   DATA[e.sp].stale = !isNaN(bt) && (Date.now() - bt) > 36 * 3600 * 1000; })
      .catch(() => fromPayload(e))
      .finally(render);
  });
}

function render(){
  const L = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==="he") ? "rtl" : "ltr";
  document.getElementById("title").textContent = L.title;
  document.getElementById("subtitle").textContent = L.subtitle;
  document.getElementById("footer").textContent = L.footer;
  document.getElementById("langToggle").textContent = (lang==="en") ? "עב" : "EN";
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  ENGINES.forEach(e => {
    const d = DATA[e.sp];
    const st = d === "na" ? {cls:"off", en:L.na, he:L.na} : (d ? d.status : {cls:"off", en:L.loading, he:L.loading});
    const rec = (d && d !== "na" && d.rec) ? `<div class="rec">${d.rec[lang]}</div>` : "";
    const a = document.createElement("a");
    a.className = "card";
    a.href = e.url;
    a.innerHTML = `
      <div class="ctop">
        <span class="icon">${e.icon}</span>
        <span class="name">${e.name[lang]}</span>
        <span class="arrow">${lang==="he"?"←":"→"}</span>
      </div>
      <div class="desc">${e.desc[lang]}</div>${rec}
      <span class="pill ${st.cls}"><span class="dot"></span>${st[lang]}</span>${(d && d !== "na" && d.stale) ? `
      <span class="pill" style="color:#f5b23d;border-color:rgba(245,178,61,0.45)">${lang==="he" ? "לא עודכן 36+ שעות" : "Not updated for 36+ h"}</span>` : ""}`;
    grid.appendChild(a);
  });
}

document.getElementById("langToggle").addEventListener("click", () => { lang = (lang === "en") ? "he" : "en"; render(); });
render();
loadAll();
</script>
<script>/* minus sign in RTL (KNOWN_DEFECTS 89), same code as preview/assets/bidi.js */
(function () {
  // A minus that starts a number gets an LRM (U+200E) before it, so in a Hebrew (RTL) line "-15%" keeps its minus on
  // the left instead of showing as "15%-" (KNOWN_DEFECTS 89). Text only, every render: values are never changed, an
  // LRM is invisible, and in English (LTR) it changes nothing. Not a minus: a hyphen after a letter, digit or %
  // ("A-1", "4-3", "2026-10-13", "ב-29.11", "3%-10%"). Idempotent: a minus that already has its LRM is left alone.
  var RE = /(^|[^\d\w.,%֐-׿‎])([-−])(?=\d)/g, SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, TEMPLATE: 1, NOSCRIPT: 1 };
  function fix(n) {
    var t = n.nodeValue;
    if (!t || (t.indexOf('-') < 0 && t.indexOf('−') < 0) || !n.parentNode || SKIP[n.parentNode.nodeName]) return;
    var u = t.replace(RE, '$1‎$2');
    if (u !== t) n.nodeValue = u;
  }
  function walk(r) {
    if (r.nodeType === 3) return fix(r);
    if (r.nodeType !== 1 || SKIP[r.nodeName]) return;
    var w = document.createTreeWalker(r, 4, null), n;
    while ((n = w.nextNode())) fix(n);
  }
  function start() {
    walk(document.body);
    new MutationObserver(function (ms) {
      for (var i = 0; i < ms.length; i++) {
        var m = ms[i];
        if (m.type === 'characterData') fix(m.target);
        else for (var j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]);
      }
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
</body>
</html>
